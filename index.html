<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="상대전적">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>워챔스 상대전적</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column — status bar, opponent card (stats → head-to-head → recent heroes), manual lookup at the bottom. Single dark look for use next to a game screen. */
:root {
  color-scheme: dark;
  --bg: #101418; --panel: #182027; --panel2: #1f2932; --ink: #e9eef2; --muted: #8d9aa6; --line: #2a3640;
  --gold: #e4b04a; --win: #4fd18b; --loss: #ff6b5e; --live: #ff4d6d;
  --hu: #6ea4ff; --oc: #ff7f50; --ne: #b18cff; --ud: #4fd1b0; --rnd: #c8b78f;
  --display: "Cinzel", Georgia, serif;
  --body: "Noto Sans KR", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 12px 40px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.bar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); padding-block: 6px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.status { white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; font-size: .82rem; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.status.s-live .dot { background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 1.4s infinite; }
.status.s-live { color: var(--live); font-weight: 700; }
.status.s-idle .dot { background: var(--win); }
.status.s-err .dot { background: var(--loss); }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.me { margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font: 500 .82rem var(--mono); }
.icon { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font-size: .78rem; color: var(--muted); }
.icon.on { color: var(--gold); border-color: var(--gold); }

.label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.ctx { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: .82rem; color: var(--muted); }
.ctx b { color: var(--ink); font-weight: 500; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.card.live { border-color: color-mix(in srgb, var(--live) 55%, var(--line)); }
.head { padding: 14px 14px 12px; display: grid; gap: 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, transparent), transparent); }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.crest { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font: 900 1.3rem var(--body); color: #0b0f12; background: var(--c); flex: none; }
.name { font: 700 1.45rem/1.1 var(--display); letter-spacing: .02em; overflow-wrap: anywhere; }
.tag { font: 500 .8rem var(--mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { background: var(--panel2); border-radius: 10px; padding: 8px 6px; text-align: center; min-width: 0; }
.stat .v { font: 700 1.15rem/1.2 var(--mono); white-space: nowrap; }
.stat .k { font-size: .68rem; color: var(--muted); }
.stat .v.gold { color: var(--gold); font-family: var(--body); font-size: .95rem; padding-top: 2px; }

.sec { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.h2h-sum { font: 700 1rem var(--body); }
.h2h-sum .w { color: var(--win); } .h2h-sum .l { color: var(--loss); }
.games { display: grid; gap: 6px; }
.g { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; background: var(--panel2); border-radius: 10px; padding: 8px 10px; }
.res { font: 900 .9rem var(--body); text-align: center; padding-top: 1px; }
.res.w { color: var(--win); } .res.l { color: var(--loss); }
.g .meta { font-size: .72rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.line { display: flex; gap: 6px; align-items: baseline; font-size: .86rem; min-width: 0; }
.line .side { font-size: .68rem; color: var(--muted); width: 26px; flex: none; }
.heroes { display: flex; flex-wrap: wrap; gap: 3px 8px; min-width: 0; }
.hero { white-space: nowrap; }
.hero i { font-style: normal; font: 700 .72rem var(--mono); color: var(--gold); margin-left: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel2); border-radius: 999px; padding: 3px 10px; font-size: .8rem; }
.chip b { color: var(--gold); font-family: var(--mono); margin-left: 4px; }
.rc { display: inline-block; font-size: .68rem; font-weight: 700; color: #0b0f12; background: var(--c); border-radius: 4px; padding: 0 5px; margin-right: 2px; }
.empty { color: var(--muted); font-size: .86rem; }
.sub1 { font-size: .9rem; color: var(--muted); margin-top: 2px; }
.mmr-big { font: 700 1.25rem var(--mono); color: var(--ink); }
.gold { color: var(--gold); font-weight: 700; }
.good { color: var(--win); }
.scout { padding: 6px 14px 14px; display: grid; gap: 7px; }
.sline { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: baseline; font-size: 1.08rem; line-height: 1.35; }
.sk { font-size: .74rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.sv { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.sv small { font: 500 .75rem var(--mono); color: var(--muted); }
.sv .w { color: var(--win); } .sv .l { color: var(--loss); }
.sv .wait { font-weight: 500; font-size: .9rem; }
.sline.alert { background: color-mix(in srgb, var(--live) 16%, transparent); border-radius: 8px; padding: 4px 8px; margin-inline: -8px; }
.sline.alert .sv, .sline.alert .sk { color: var(--live); }
.sfoot { font-size: .7rem; color: var(--muted); }
.smeta { font: 500 .72rem var(--body); color: var(--muted); margin-top: 2px; }
.hskill { line-height: 1.35; }
.sv .num { font-family: var(--mono); color: var(--gold); }
.hskill span { font-weight: 500; font-size: .92rem; }
details.all { border-top: 1px solid var(--line); }
details.all > summary { cursor: pointer; list-style: none; padding: 12px 14px; color: var(--muted); font-size: .86rem; }
details.all > summary::-webkit-details-marker { display: none; }
details.all > summary::before { content: "▸ "; }
details.all[open] > summary::before { content: "▾ "; }
.slot { display: grid; gap: 10px; }
.waitbar { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: .86rem; }
.waitbar .dot { background: var(--win); }
.hist { display: grid; gap: 6px; }
.hrow { display: grid; gap: 6px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.hrow.won { border-left-color: var(--win); } .hrow.lost { border-left-color: var(--loss); }
.hrow:active { background: var(--panel2); }
.hvs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: start; }
.hvs > .vs { color: var(--muted); font-size: .72rem; padding-top: 4px; }
.hside { display: grid; gap: 2px; min-width: 0; }
.hside.theirs { text-align: right; justify-items: end; }
.hname { display: flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; }
.hname b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hres { font-size: .84rem; }
.hres .mmr { font: 500 .78rem var(--mono); color: var(--muted); }
.hres .res { font-weight: 900; }
.hside .heroes { font-size: .74rem; gap: 1px 6px; }
.hside.theirs .heroes { justify-content: flex-end; }
.hmeta { display: flex; justify-content: space-between; gap: 8px; font-size: .72rem; color: var(--muted); }
.gain { font: 700 .86rem var(--mono); }
.gain.w { color: var(--win); } .gain.l { color: var(--loss); }
.ghost { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; color: var(--ink); }
.back { justify-self: start; background: none; border: 0; color: var(--gold); font-weight: 700; padding: 4px 0; }
.units { font-size: .8rem; color: var(--ink); display: flex; gap: 6px; align-items: baseline; }
.units:empty { display: none; }
.units .side { font-size: .68rem; color: var(--muted); width: 26px; flex: none; }
.units .u { white-space: nowrap; }
.units .u i { font-style: normal; font: 700 .72rem var(--mono); color: var(--gold); margin-left: 2px; }
.units .wait { color: var(--muted); }
.usum { display: grid; gap: 6px; }
.usum:empty { display: none; }
.ana { display: grid; gap: 4px; }
.units .t { font: 500 .7rem var(--mono); color: var(--muted); }
.units .u.unit, .flow .u.unit { color: var(--gold); }
.tagx { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: .74rem; color: var(--ink); }
.warn { color: var(--live); }
.tagx.warn { border-color: color-mix(in srgb, var(--live) 60%, var(--line)); }
details.more { font-size: .78rem; }
details.more summary { cursor: pointer; color: var(--muted); padding: 4px 0; list-style: none; }
details.more summary::before { content: "▸ "; }
details.more[open] summary::before { content: "▾ "; }
details.more summary::-webkit-details-marker { display: none; }
details.more dl { margin: 4px 0 0; display: grid; gap: 6px; }
details.more dt { font-size: .66rem; color: var(--muted); letter-spacing: .06em; }
details.more dd { margin: 0; line-height: 1.6; }
details.more dd b { font-weight: 700; }
.flow { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.flow .u { white-space: nowrap; }
.flow .t { font: 500 .7rem var(--mono); color: var(--muted); }
.loading { color: var(--muted); font-size: .86rem; padding: 18px 14px; }

.idle { text-align: center; padding: 22px 14px; color: var(--muted); display: grid; gap: 6px; }
.idle strong { color: var(--ink); font-size: 1.05rem; }

form.find { display: flex; gap: 8px; }
form.find input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
form.find button, .btn { background: var(--gold); color: #1a1205; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; }
.foot { text-align: center; font-size: .74rem; color: var(--muted); }
.foot a { color: inherit; }

dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(92vw, 380px); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog form { display: grid; gap: 10px; }
dialog input { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
@media (prefers-reduced-motion: reduce) { .status.s-live .dot { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="status" id="status"><span class="dot"></span><span id="statusText">연결 중…</span></span>
    <button class="icon" id="wake" type="button" title="화면 꺼짐 방지">화면 유지</button>
    <button class="me" id="meBtn" type="button"></button>
  </div>

  <div id="live" class="slot"><div class="waitbar"><span class="dot"></span><span>연결 중…</span></div></div>

  <div id="detail" class="slot" hidden></div>

  <section id="history" class="slot">
    <div class="sec-h"><span class="label" id="histTitle">내 경기 기록</span></div>
    <div id="hist" class="hist"><div class="loading">경기 기록을 불러오는 중…</div></div>
    <button type="button" class="ghost" id="histMore" hidden>더 보기</button>
  </section>

  <form class="find" id="find" autocomplete="off">
    <input id="findInput" placeholder="상대 배틀태그 직접 조회 (예: Lukas#21464)" aria-label="상대 배틀태그">
    <button type="submit">조회</button>
  </form>
  <div class="foot">게임에 들어가면 5초 안에 맨 위에 상대 전적이 뜹니다 · <a href="search.html">전체 검색</a> · 데이터 w3champions.com</div>
</div>

<dialog id="meDlg">
  <form method="dialog" id="meForm">
    <div class="label">내 배틀태그</div>
    <input id="meInput" placeholder="winslin#3872" aria-label="내 배틀태그">
    <button class="btn" type="submit">저장</button>
  </form>
</dialog>

<script>
const API = "https://website-backend.w3champions.com/api";
const GW = 20;
const POLL_MS = 5000;
const RACES = { 0: ["랜덤", "--rnd", "R"], 1: ["휴먼", "--hu", "H"], 2: ["오크", "--oc", "O"], 4: ["나엘", "--ne", "N"], 8: ["언데드", "--ud", "U"], 16: ["랜덤", "--rnd", "R"] };
const LEAGUES = ["그마", "마스터", "어뎁트", "다이아", "플래", "골드", "실버", "브론즈", "그래스"];
const HEROES = {
  archmage: "아크메이지", mountainking: "마운틴킹", paladin: "팔라딘", bloodmage: "블러드메이지",
  blademaster: "블마", farseer: "파시어", taurenchieftain: "타우렌", shadowhunter: "쉐헌",
  demonhunter: "데헌", keeperofthegrove: "키퍼", priestessofthemoon: "포문", warden: "워든",
  deathknight: "데나", lich: "리치", dreadlord: "드레드로드", cryptlord: "크립트로드",
  seawitch: "나가", pandarenbrewmaster: "판다", beastmaster: "비마", pitlord: "핏로드",
  tinker: "팅커", sorceror: "소서러", forsakenpaladin: "포세이큰 팔라딘", bansheeranger: "밴시 레인저", avatarofflame: "파이어로드", alchemist: "알케", darkranger: "다크레인저",
};
const WORKERS = new Set(["hpea", "opeo", "ewsp", "uaco", "hmil"]);
const UNITS = {
  hfoo: "풋맨", hrif: "라이플", hkni: "나이트", hmpr: "프리스트", hsor: "소서리스", hspt: "스펠브", hmtm: "모탈팀",
  hgry: "그리폰", hgyr: "자이로", hmtt: "시즈엔진", hrtt: "시즈엔진", hdhw: "드래곤호크",
  ogru: "그런트", ohun: "헤드헌터", otbk: "버서커", ocat: "데몰리셔", oshm: "샤먼", odoc: "위치닥터",
  ospw: "스피릿워커", ospm: "스피릿워커", orai: "울프", okod: "코도", otbr: "배트", owyv: "와이번", otau: "타우렌",
  earc: "아처", esen: "헌트리스", ebal: "발리스타", edry: "드라이어드", edoc: "곰드루", edcm: "곰드루",
  emtg: "자이언트", ehip: "히포", ehpr: "히포라이더", edot: "새드루", edtm: "새드루", efdr: "페어리", echm: "키메라",
  ugho: "구울", ucry: "핀드", ugar: "가고일", ugrm: "가고일", uabo: "어보미", umtw: "미트웨건", unec: "네크로",
  uban: "밴시", uobs: "옵시디언", ubsp: "디스트로이어", ufro: "프웜", ushd: "쉐이드",
  nftb: "트롤버서커", nfsp: "트롤프리스트", nogm: "오우거", ngir: "슈레더", nzep: "비행선", ngsp: "고블린공병",
  nkob: "코볼트", nmrr: "머로더", nsat: "사티로스", nmfs: "머로크", nftr: "트롤", nhrw: "하피",
};
const unitList = (u, max = 8) => Object.entries(u || {}).filter(([k]) => !WORKERS.has(k)).sort((a, b) => b[1] - a[1]).slice(0, max)
  .map(([k, n]) => `<span class="u">${esc(UNITS[k] || k)}<i>${n}</i></span>`).join("") || `<span class="wait">전투 유닛 없음</span>`;
let MODES = { 1: "1v1", 2: "2v2", 4: "4v4", 5: "FFA", 6: "2v2 AT" };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const race = (r) => RACES[r] || ["?", "--rnd", "?"];
const rc = (r) => `<span class="rc" style="--c:var(${race(r)[1]})">${race(r)[0]}</span>`;
const pct = (x) => Math.round(x * 100) + "%";
const heroName = (h) => HEROES[h.name] || h.name;
const heroList = (pl) => (pl?.heroes || []).map((h) => `<span class="hero">${esc(heroName(h))}<i>${h.level}</i></span>`).join("") || `<span class="empty">-</span>`;
const day = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };
const dur = (s) => `${Math.floor(s / 60)}분`;
const lower = (s) => String(s || "").toLowerCase();

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } }

const state = { me: store("w3c_me") || "winslin#3872", liveId: null, idleShown: false, seasons: null, current: null, mySeasons: [] };

async function get(path) {
  const res = await fetch(API + path, { cache: "no-store" });
  if (res.status === 404 || res.status === 204) return null;
  if (!res.ok) throw new Error("서버 응답 " + res.status);
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

function setStatus(kind, text) {
  const s = $("#status"); s.className = "status s-" + kind; $("#statusText").textContent = text;
}

/* ---------- opponent card ---------- */
function findMe(match) {
  for (const t of match.teams) for (const p of t.players) if (lower(p.battleTag) === lower(state.me)) return { team: t, pl: p };
  return null;
}

async function seasonsOf(tag) {
  const p = await get(`/players/${encodeURIComponent(tag)}`);
  return { profile: p, seasons: (p?.participatedInSeasons || []).map((s) => s.id).sort((a, b) => b - a) };
}

async function headToHead(opp, oppSeasons) {
  const shared = state.mySeasons.filter((s) => oppSeasons.includes(s));
  const lists = await Promise.all(shared.map((s) =>
    get(`/matches/search?playerId=${encodeURIComponent(state.me)}&opponentId=${encodeURIComponent(opp)}&gateway=${GW}&offset=0&pageSize=100&season=${s}`).catch(() => null)));
  return lists.flatMap((d) => d?.matches || []).sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
}

function gameRow(m, focusTag, labels, withUnits) {
  let a, b;
  for (const t of m.teams) for (const p of t.players) { if (lower(p.battleTag) === lower(focusTag)) a = { p, t }; }
  if (!a) return "";
  const others = m.teams.filter((t) => t !== a.t).flatMap((t) => t.players);
  b = others[0];
  const won = a.p.won;
  return `<div class="g">
    <div class="res ${won ? "w" : "l"}">${won ? "승" : "패"}</div>

async function renderOpponent(el, opp, info) {
  // info: { race, mmr, gameMode, live, myRace }
  const tag = opp.battleTag;
  const myRace = info.myRace ?? state.myRace ?? 4;
  const myRaceName = race(myRace)[0];
  const [, rVar, rLetter] = race(info.race);
  el.style.setProperty("--c", `var(${rVar})`);
  el.innerHTML = `<div class="head"><div class="who"><div class="crest">${rLetter}</div><div style="min-width:0"><div class="name">${esc(opp.name || tag.split("#")[0])}</div><div class="sub1">불러오는 중…</div></div></div></div>`;

  try {
    const { profile, seasons } = await seasonsOf(tag);
    const season = seasons[0] ?? state.current;
    const [modes, settings, h2h, recent] = await Promise.all([
      season != null ? get(`/players/${encodeURIComponent(tag)}/game-mode-stats?gateWay=${GW}&season=${season}`).catch(() => []) : [],
      get(`/personal-settings/${encodeURIComponent(tag)}`).catch(() => null),
      headToHead(tag, seasons),
      season != null ? get(`/matches/search?playerId=${encodeURIComponent(tag)}&gateway=${GW}&offset=0&pageSize=15&season=${season}`).catch(() => null) : null,
    ]);
    const gm = info.gameMode || 1;
    const ms = (modes || []).filter((m) => m.gameMode === gm);
    const st = ms.find((m) => m.race === info.race) || ms.sort((a, b) => b.games - a.games)[0];
    const mmr = info.mmr ?? st?.mmr;
    const lg = st && st.rank > 0 ? `${LEAGUES[st.leagueOrder] ?? "리그"}${st.division ? " " + st.division : ""}` : "배치 전";
    const total = (profile?.winLosses || []).filter((w) => w.games).sort((a, b) => b.games - a.games);
    const loc = settings?.country || settings?.location;
    const wins = h2h.filter((m) => findMe(m)?.pl.won).length;

    const rec = (recent?.matches || []).filter((m) => m.gameMode === gm);
    const firstHeroes = {};
    for (const m of rec) for (const t of m.teams) for (const p of t.players)
      if (lower(p.battleTag) === lower(tag) && p.heroes?.[0]) { const n = heroName(p.heroes[0]); firstHeroes[n] = (firstHeroes[n] || 0) + 1; }
    const fh = Object.entries(firstHeroes).sort((a, b) => b[1] - a[1]);
    let streak = 0, sw = null;
    for (const m of rec) {
      const me = m.teams.flatMap((t) => t.players).find((p) => lower(p.battleTag) === lower(tag));
      if (!me) continue;
      if (sw === null) sw = me.won;
      if (me.won !== sw) break;
      streak++;
    }

    el.innerHTML = `
      <div class="head">
        <div class="who">
          <div class="crest">${rLetter}</div>
          <div style="min-width:0">
            <div class="name">${esc(profile?.name || opp.name || tag)}</div>
            <div class="sub1"><b class="mmr-big">${mmr ?? "-"}</b> MMR · <span class="gold">${lg}</span>${st ? ` · 승률 ${pct(st.winrate)}` : ""}${streak >= 2 ? ` · <b class="${sw ? "warn" : "good"}">${streak}${sw ? "연승" : "연패"}</b>` : ""}</div>
          </div>
        </div>
      </div>
      <div class="scout">
        <div class="sline"><span class="sk">나와</span><span class="sv">${h2h.length ? `${h2h.length}전 <span class="w">${wins}승</span> <span class="l">${h2h.length - wins}패</span>` : "첫 대결"}</span></div>
        <div class="hero-line">${heroLineHtml(fh, rec.length, [])}</div>
        <div class="scout-ana"><div class="sline"><span class="sk"></span><span class="sv wait">리플레이 분석 중…</span></div></div>
      </div>
      <details class="all">
        <summary>자세히 보기 · 경기별 빌드 · 아이템</summary>
        <div class="sec h2hs">
          <div class="sec-h"><span class="label">나와의 경기</span><span class="h2h-sum">${h2h.length ? `${h2h.length}전 <span class="w">${wins}승</span> <span class="l">${h2h.length - wins}패</span>` : "첫 대결"}</span></div>
          ${h2h.length ? `<div class="games">${h2h.slice(0, 10).map((m, i) => gameRow(m, state.me, ["나", "상대"], i < UNIT_GAMES)).join("")}</div>` : `<div class="empty">아직 이 상대와 붙은 기록이 없습니다.</div>`}
        </div>
        <div class="sec vsr"><div class="sec-h"><span class="label">상대 vs ${myRaceName} 경기</span></div><div class="empty">경기 찾는 중…</div></div>
        <div class="sec">
          <div class="sec-h"><span class="label">기본 정보</span></div>
          <div class="empty">${esc(tag)}${loc ? " · " + esc(loc) : ""}${st?.rank > 0 ? ` · #${st.rank}` : ""}${st ? ` · ${st.wins}승 ${st.losses}패 · 상위 ${Math.max(1, Math.round((1 - st.quantile) * 100))}%` : ""}</div>
          <div class="empty">통산 ${total.map((w) => `${race(w.race)[0]} ${w.wins}-${w.losses}`).join(" · ") || "-"}</div>
          ${rec.length ? `<div class="sec-h"><span class="label">최근 ${rec.length}경기 중 5경기</span></div><div class="games">${rec.slice(0, 5).map((m) => gameRow(m, tag, ["상대", "vs"])).join("")}</div>` : ""}
        </div>
      </details>`;

    const pool = [];
    const scout = el.querySelector(".scout-ana");
    const paint = (pending) => {
      if (!el.isConnected) return;
      scout.innerHTML = scoutHtml(pool, myRaceName, pending, info.map);
      el.querySelector(".hero-line").innerHTML = heroLineHtml(fh, rec.length, pool);
    };
    (async () => {
      const h2hGames = h2h.slice(0, UNIT_GAMES);
      if (h2hGames.length) await analyzeUnits(el, el.querySelector(".h2hs"), tag, h2hGames, { other: "나", vsMe: true, onResult: (o, me, m) => { pool.push({ o, me, vsMe: true, map: m.mapName, at: m.startTime }); paint(true); } });
      if (!el.isConnected) return;
      const vs = el.querySelector(".vsr");
      const games = await vsRaceGames(tag, myRace, seasons, new Set(h2h.map((m) => m.id))).catch(() => []);
      if (!el.isConnected) return;
      const w = games.filter((m) => m.teams.flatMap((t) => t.players).find((p) => lower(p.battleTag) === lower(tag))?.won).length;
      vs.innerHTML = `<div class="sec-h"><span class="label">상대 vs ${myRaceName} 최근 ${games.length}경기</span>${games.length ? `<span class="h2h-sum"><span class="w">${w}승</span> <span class="l">${games.length - w}패</span></span>` : ""}</div>`
        + (games.length ? `<div class="games">${games.map((m) => gameRow(m, tag, ["상대", "vs"], true)).join("")}</div>`
          : `<div class="empty">최근 두 시즌에 ${myRaceName} 상대 1v1 기록이 없습니다.</div>`);
      if (games.length) { paint(true); await analyzeUnits(el, vs, tag, games, { other: "상대편", vsMe: false, onResult: (o, me, m) => { pool.push({ o, vsMe: false, map: m.mapName, at: m.startTime }); paint(true); } }); }
      paint(false);
    })();
  } catch (e) {
    el.insertAdjacentHTML("beforeend", `<div class="sec empty">상대 정보를 불러오지 못했습니다 (${esc(e.message)}).</div>`);
  }
}

// The glanceable summary: one big line per thing that changes how I play this game.
// Hero line: the opponent's heroes in pick order with skill order, from the newest analysed replay.
// newest analysed game (pool mixes head-to-head and vs-race games)
const latestOf = (pool) => pool.reduce((a, x) => (!a || new Date(x.at) > new Date(a.at) ? x : a), null);

function heroLineHtml(fh, recCount, pool) {
  const meta = fh.length ? `<div class="smeta">첫 영웅 · 최근 ${recCount}경기 중 ${fh.slice(0, 2).map(([n, c]) => `${esc(n)} ${c}번`).join(", ")}</div>` : "";
  const heroes = latestOf(pool)?.o.heroes || [];
  const body = heroes.length
    ? heroes.map((h, i) => `<div class="hskill">${i + 1}. <b>${nm(HERO_CODES, h.id)}</b>${h.skills.length ? ` <span>(${h.skills.map((x) => nm(SKILLS, x)).join(" → ")})</span>` : ""}</div>`).join("")
    : fh.length ? fh.slice(0, 2).map(([n]) => esc(n)).join(" · ") + ` <span class="wait">스킬 분석 중…</span>` : "-";
  return `<div class="sline"><span class="sk">영웅</span><span class="sv">${body}${meta}</span></div>`;
}

function scoutHtml(pool, myRaceName, pending, mapName) {
  const line = (k, v, cls = "") => `<div class="sline ${cls}"><span class="sk">${k}</span><span class="sv">${v}</span></div>`;
  if (!pool.length) return pending ? line("", `<span class="wait">리플레이 분석 중…</span>`) : line("", `<span class="wait">분석할 리플레이가 없습니다</span>`);
  const n = pool.length;
  const total = {};
  for (const { o } of pool) for (const [k, c] of Object.entries(o.units || {})) if (!WORKERS.has(k)) total[k] = (total[k] || 0) + c;
  const last = latestOf(pool);
  const top = Object.entries(last.o.units || {}).filter(([k]) => !WORKERS.has(k)).sort((a, b) => b[1] - a[1]).slice(0, 6)
    .map(([k, c]) => `${esc(UNITS[k] || k)} <span class="num">${c}</span>`);
  const t2 = pool.map((x) => x.o.tier2).filter((v) => v != null);
  const t3 = pool.map((x) => x.o.tier3).filter((v) => v != null);
  const ex = pool.map((x) => x.o.expo).filter((v) => v != null);
  const towers = pool.filter((x) => x.o.towers5 >= 2).length;
  const army6 = pool.map((x) => x.o.army6).filter((v) => v != null);
  const out = [];
  if (towers) out.push(line("경고", `초반 타워 ${towers}/${n}경기`, "alert"));
  out.push(line("유닛", `${top.join(" · ") || "-"}<div class="smeta">직전 경기 생산 수 · ${day(last.at)} ${esc(last.map || "")}${last.vsMe ? " · 나와 한 경기" : ""} (일꾼 제외)</div>`));
  const tech = [];
  if (t2.length) { const a = avg(t2); tech.push(`2티어 ${mmss(a)}${a < 180000 ? ' <b class="warn">빠름</b>' : ""}`); }
  if (t3.length) { const a = avg(t3); tech.push(`3티어 ${mmss(a)}${a < 480000 ? ' <b class="warn">빠름</b>' : ""}${t3.length < n ? ` <small>${n}경기 중 ${t3.length}번</small>` : ""}`); }
  else tech.push("3티어 안 감");
  out.push(line("테크", `${tech.join(" · ")}<div class="smeta">티어 올리기 시작한 시각 (완성 시각 아님)</div>`));
  if (ex.length) { const a = avg(ex); out.push(line("멀티", `${mmss(a)}${a < 360000 ? ' <b class="warn">빠름</b>' : a > 720000 ? " 늦음" : ""} <small>${n}경기 중 ${ex.length}번</small>`)); }
  else out.push(line("멀티", "안 함"));
  if (army6.length) out.push(line("초반", `6분까지 병력 ${Math.round(avg(army6))}기`));
  const withRoute = pool.filter((x) => x.o.route?.stops.length);
  const pick = withRoute.find((x) => mapName && x.map === mapName) || withRoute[0];
  if (pick) {
    const same = mapName && pick.map === mapName;
    if (SHOW_ROUTE) out.push(line("동선", `${routeText(pick.o.route, pick.vsMe ? "내 진영" : "상대편 진영")}<div class="smeta">${esc(pick.map || "")} · 시작 ${pick.o.route.start}${same ? " · <b class=\"good\">같은 맵</b>" : ""}</div>`));
  }
  const vsMe = pool.filter((x) => x.vsMe).length;
  out.push(`<div class="sfoot">리플레이 ${n}경기 기준 (나와 ${vsMe} · 다른 ${myRaceName} ${n - vsMe})${pending ? " · 분석 중…" : ""}</div>`);
  return out.join("");
}

/* opponent's latest 1v1 games against my race, excluding our own games */
const VSR_GAMES = 3;
async function vsRaceGames(tag, myRace, seasons, exclude) {
  const out = [];
  for (const s of seasons.slice(0, 2)) {
    for (let offset = 0; offset < 200 && out.length < VSR_GAMES; offset += 100) {
      const d = await get(`/matches/search?playerId=${encodeURIComponent(tag)}&gateway=${GW}&offset=${offset}&pageSize=100&season=${s}`);
      const ms = d?.matches || [];
      for (const m of ms) {
        if (m.gameMode !== 1 || exclude.has(m.id)) continue;
        const other = m.teams.flatMap((t) => t.players).find((p) => lower(p.battleTag) !== lower(tag));
        if (other && other.race === myRace) out.push(m);
        if (out.length >= VSR_GAMES) break;
      }
      if (ms.length < 100) break;
    }
    if (out.length >= VSR_GAMES) break;
  }
  return out;
}

const nm = (dict, k) => esc(dict[k] || k);
const mmss = (ms) => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
// the same command is often sent twice in a row; keep one per id within 2s
// buildings people build several of at once keep the short window; one-off buildings use 10s
const MULTI = new Set(["hhou", "otrb", "emow", "uzig", "hwtw", "owtw", "etrp", "uzg1", "uzg2"]);
function dedupe(list, single = false) {
  const last = {}; const out = [];
  for (const [id, ms] of list || []) {
    const win = single && !MULTI.has(id) ? 10000 : 2000;
    if (last[id] != null && ms - last[id] < win) continue;
    last[id] = ms; out.push([id, ms]);
  }
  return out;
}
const firstAt = (list, set) => { const hit = (list || []).find(([id]) => set.has(id)); return hit ? hit[1] : null; };

let parserPromise = null;
function loadParser() {
  if (!parserPromise) parserPromise = new Promise((ok, fail) => {
    const s = document.createElement("script"); s.src = "w3g.js";
    s.onload = () => (window.W3G ? ok(window.W3G) : fail(new Error("parser missing")));
    s.onerror = () => { parserPromise = null; fail(new Error("w3g.js를 불러오지 못했습니다")); };
    document.head.appendChild(s);
  });
  return parserPromise;
}

/* creep route: where a player sent commands away from their own base, in 30s windows.
   Replays only hold commands, so this is where they clicked, not proof of what they killed. */
function baseOf(points) {
  const early = (points || []).filter(([ms]) => ms < 40000);
  if (!early.length) return null;
  const xs = early.map((p) => p[1]).sort((a, b) => a - b), ys = early.map((p) => p[2]).sort((a, b) => a - b);
  return [xs[xs.length >> 1], ys[ys.length >> 1]];
}
function compass(x, y, T) {
  const h = x < -T ? "왼쪽" : x > T ? "오른쪽" : "";
  const v = y > T ? "위" : y < -T ? "아래" : "";
  return h && v ? `${h} ${v}` : h || v || "가운데";
}
function routeOf(points, own, enemy) {
  if (!own || !enemy || !points?.length) return null;
  const cx = (own[0] + enemy[0]) / 2, cy = (own[1] + enemy[1]) / 2;
  const span = Math.hypot(own[0] - enemy[0], own[1] - enemy[1]);
  if (span < 1000) return null;
  const T = span / 2 / Math.SQRT2 / 2.2;
  const ownDir = compass(own[0] - cx, own[1] - cy, T), enemyDir = compass(enemy[0] - cx, enemy[1] - cy, T);
  const d = (p, b) => Math.hypot(p[1] - b[0], p[2] - b[1]);
  const label = (p) => {
    if (d(p, own) < span * 0.2) return null;
    if (d(p, enemy) < span * 0.2) return "@enemy";
    const c = compass(p[1] - cx, p[2] - cy, T);
    return c === ownDir ? "@own" : c === enemyDir ? "@enemy" : c;
  };
  const stops = [];
  for (let t = 90000; t < 450000; t += 30000) {
    const c = {};
    for (const p of points) if (p[0] >= t && p[0] < t + 30000) { const l = label(p); if (l) c[l] = (c[l] || 0) + (l === "@enemy" ? 2 : 1); }
    const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
    if (!best || best[1] < 2) continue;
    if (stops.length && stops[stops.length - 1][1] === best[0]) continue;
    stops.push([t, best[0]]);
  }
  return { start: ownDir, stops };
}
const SHOW_ROUTE = false; // route display is off for now; routeOf() still runs so it can come back
function routeText(r, enemyName) {
  if (!r || !r.stops.length) return "";
  return r.stops.map(([t, l]) => `${mmss(t)} ${l === "@own" ? "본진 주변" : l === "@enemy" ? enemyName : l}`).join(" → ");
}

// Condense one player's replay data into what the card shows; this is what gets cached.
function digest(p, route) {
  const builds = dedupe(p.buildings, true);
  const seen = new Set(); const firstUnits = [];
  for (const [id, ms] of p.unitOrder || []) if (!WORKERS.has(id) && !seen.has(id)) { seen.add(id); firstUnits.push([id, ms]); }
  return {
    apm: p.apm, units: p.units,
    tier2: firstAt(builds, TIER2), tier3: firstAt(builds, TIER3), expo: firstAt(builds, HALLS),
    towers5: builds.filter(([id, ms]) => TOWERS.has(id) && ms < 5 * 60000).length,
    army6: (p.unitOrder || []).filter(([id, ms]) => !WORKERS.has(id) && ms < 6 * 60000).length,
    build: [...builds.map(([id, ms]) => ["b", id, ms]), ...firstUnits.map(([id, ms]) => ["u", id, ms])].filter((x) => x[2] <= BUILD_WINDOW).sort((a, b) => a[2] - b[2]),
    items: dedupe(p.items).slice(0, 14),
    upgrades: dedupe(p.upgrades),
    heroes: (p.heroes || []).map((h) => ({ id: h.id, level: h.level, retrain: h.retrain, skills: h.skills.map((s) => s[0]).slice(0, 10) })),
    route,
  };
}

async function analysisOf(matchId) {
  const key = "w3c_a4_" + matchId;
  const hit = store(key); if (hit) try { return JSON.parse(hit); } catch {}
  const W3G = await loadParser();
  const res = await fetch(`${API}/replays/${encodeURIComponent(matchId)}`);
  if (!res.ok) throw new Error("리플레이 없음");
  const r = await W3G.parseReplay(await res.arrayBuffer());
  const out = {};
  const bases = r.players.map((p) => baseOf(p.points));
  r.players.forEach((p, i) => {
    const j = r.players.length === 2 ? 1 - i : -1;
    out[lower(p.name)] = digest(p, j >= 0 ? routeOf(p.points, bases[i], bases[j]) : null);
  });
  store(key, JSON.stringify(out));
  return out;
}

const skillLine = (h) => `<b>${nm(HERO_CODES, h.id)}</b> ${h.skills.map((s) => nm(SKILLS, s)).join(" → ") || "-"}${h.retrain ? " <span class=\"wait\">(리트레이닝)</span>" : ""}`;
const timeline = (list, dict) => list.map(([id, ms]) => `<span class="u"><span class="t">${mmss(ms)}</span> ${nm(dict, id)}</span>`).join("") || `<span class="wait">없음</span>`;

function detailHtml(o, me, other = "나") {
  const build = o.build.map(([k, id, ms]) => `<span class="u ${k === "u" ? "unit" : ""}"><span class="t">${mmss(ms)}</span> ${k === "u" ? nm(UNITS, id) : nm(BUILDINGS, id)}</span>`).join("") || `<span class="wait">없음</span>`;
  return `<details class="more"><summary>빌드 · 스킬 · 아이템 자세히</summary>
    <dl>
      <dt>빌드 (6분까지)</dt><dd class="flow">${build}</dd>
      ${SHOW_ROUTE && o.route?.stops.length ? `<dt>크립 동선 (시작 ${o.route.start})</dt><dd>${routeText(o.route, other === "나" ? "내 진영" : "상대편 진영")}</dd>` : ""}
      <dt>영웅 스킬 순서</dt><dd>${o.heroes.map((h) => `<div>${skillLine(h)}</div>`).join("") || "-"}</dd>
      <dt>아이템</dt><dd class="flow">${timeline(o.items, ITEMS)}</dd>
      <dt>업그레이드</dt><dd class="flow">${timeline(o.upgrades, UPGRADES)}</dd>
      <dt>티어 · 멀티</dt><dd>2티어 ${o.tier2 != null ? mmss(o.tier2) : "-"} · 3티어 ${o.tier3 != null ? mmss(o.tier3) : "-"} · 멀티 ${o.expo != null ? mmss(o.expo) : "안 함"}${o.towers5 >= 2 ? ` · <b class="warn">5분 전 타워 ${o.towers5}개</b>` : ""}</dd>
      <dt>APM</dt><dd>상대 ${o.apm}${me ? ` · ${other} ${me.apm}` : ""}</dd>
    </dl></details>`;
}

function summaryHtml(list, total, games, opt = { other: "나", vsMe: true }) {
  // list: [{o, me}] for analysed games, newest first
  const n = list.length;
  const t2 = list.map((x) => x.o.tier2).filter((v) => v != null);
  const t3 = list.map((x) => x.o.tier3).filter((v) => v != null);
  const ex = list.map((x) => x.o.expo).filter((v) => v != null);
  const towerGames = list.filter((x) => x.o.towers5 >= 2).length;
  const itemCount = {};
  for (const { o } of list) for (const id of new Set(o.items.filter(([, ms]) => ms < BUILD_WINDOW).map(([id]) => id))) itemCount[id] = (itemCount[id] || 0) + 1;
  const items = Object.entries(itemCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const myApm = list.map((x) => x.me?.apm).filter(Boolean);
  const h = list[0].o.heroes[0];
  const tags = [];
  if (towerGames) tags.push(`<span class="tagx warn">초반 타워 ${towerGames}/${n}경기</span>`);
  if (ex.length) tags.push(`<span class="tagx">멀티 ${ex.length}/${n}경기 · 평균 ${mmss(avg(ex))}</span>`);
  else tags.push(`<span class="tagx">멀티 안 함 (${n}경기)</span>`);
  if (t2.length) tags.push(`<span class="tagx">2티어 평균 ${mmss(avg(t2))}</span>`);
  if (t3.length) tags.push(`<span class="tagx">3티어 ${t3.length}/${n}경기 · ${mmss(avg(t3))}</span>`);
  tags.push(`<span class="tagx">APM 상대 ${Math.round(avg(list.map((x) => x.o.apm)))}${myApm.length ? ` / ${opt.other} ${Math.round(avg(myApm))}` : ""}</span>`);
  return `
    <div class="units"><span class="side">주력</span><span class="heroes">${unitList(total, 6)}</span></div>
    <div class="chips">${tags.join("")}</div>
    ${h ? `<div class="units"><span class="side">스킬</span><span>${skillLine({ ...h, skills: h.skills.slice(0, 5) })}</span></div>` : ""}
    ${items.length ? `<div class="units"><span class="side">템</span><span class="heroes">${items.map(([id, c]) => `<span class="u">${nm(ITEMS, id)}<i>${c}</i></span>`).join("")}</span></div>` : ""}
    <div class="empty" style="font-size:.72rem">${opt.vsMe ? "나와 한" : "다른 유저와 한"} 최근 ${n}경기 리플레이 기준${n < games ? ` · 분석 중 ${n}/${games}` : ""} · 스킬은 직전 경기 첫 영웅, 템은 6분 전 구매 횟수</div>`;
}

async function analyzeUnits(el, sec, tag, games, opt) {
  const total = {}; const list = [];
  const sum = sec.querySelector(".usum");
  if (sum) sum.innerHTML = `<div class="units"><span class="side">분석</span><span class="wait">리플레이 분석 중 0/${games.length}</span></div>`;
  for (const m of games) {
    if (!el.isConnected) return;
    const box = sec.querySelector(`.ana[data-mid="${CSS.escape(m.id)}"]`);
    if (box) box.innerHTML = `<div class="units"><span class="side">유닛</span><span class="wait">분석 중…</span></div>`;
    try {
      const a = await analysisOf(m.id);
      const otherTag = opt.vsMe ? state.me : m.teams.flatMap((t) => t.players).find((p) => lower(p.battleTag) !== lower(tag))?.battleTag;
      const o = a[lower(tag)], me = a[lower(otherTag)];
      if (!o) throw new Error("리플레이에서 상대를 찾지 못함");
      if (box) box.innerHTML = `<div class="units"><span class="side">유닛</span><span class="heroes">${unitList(o.units)}</span></div>${detailHtml(o, me, opt.other)}`;
      for (const [k, n] of Object.entries(o.units || {})) if (!WORKERS.has(k)) total[k] = (total[k] || 0) + n;
      list.push({ o, me });
      opt.onResult?.(o, me, m);
      if (sum) sum.innerHTML = summaryHtml(list, total, games.length, opt);
    } catch (e) {
      if (box) box.innerHTML = `<div class="units"><span class="side">유닛</span><span class="wait">${esc(e.message)}</span></div>`;
    }
  }
  if (!list.length && sum) sum.innerHTML = `<div class="empty">리플레이를 분석하지 못했습니다.</div>`;
}

/* ---------- match rendering ---------- */
function matchCtx(match, label, live) {
  const ping = match.serverInfo?.playerServerInfos?.find((p) => lower(p.battleTag) === lower(state.me))?.averagePing;
  return `<div class="ctx"><span class="label" style="color:${live ? "var(--live)" : "var(--muted)"}">${label}</span><span><b>${esc(match.mapName || match.map)}</b>${MODES[match.gameMode] ? " · " + esc(MODES[match.gameMode]) : ""}${match.serverInfo?.name ? " · " + esc(match.serverInfo.name) : ""}${ping ? " · 핑 " + ping : ""}${live ? "" : " · " + day(match.startTime)}</span></div>`;
}
function renderMatch(box, match, live, label) {
  const mine = findMe(match);
  const opps = match.teams.filter((t) => t !== mine?.team).flatMap((t) => t.players);
  box.innerHTML = matchCtx(match, label, live);
  for (const o of opps) {
    const el = document.createElement("section");
    el.className = "card" + (live ? " live" : "");
    box.appendChild(el);
    renderOpponent(el, o, { race: o.race, mmr: o.oldMmr, gameMode: match.gameMode, live, myRace: mine?.pl.race, map: match.mapName });
  }
  if (!opps.length) box.insertAdjacentHTML("beforeend", `<div class="card idle">상대 정보가 없는 경기입니다.</div>`);
}

}

/* ---------- my match history ---------- */
const hist = { offset: 0, total: 0, byId: new Map(), loading: false };
async function loadHistory(reset) {
  if (hist.loading) return;
  hist.loading = true;
  const box = $("#hist");
  const season = state.mySeasons[0] ?? state.current;
  if (reset) { hist.offset = 0; hist.byId.clear(); box.innerHTML = `<div class="loading">경기 기록을 불러오는 중…</div>`; }
  try {
    const d = await get(`/matches/search?playerId=${encodeURIComponent(state.me)}&gateway=${GW}&offset=${hist.offset}&pageSize=20&season=${season}`);
    const list = d?.matches || [];
    hist.total = d?.count || 0;
    $("#histTitle").textContent = `내 경기 기록 · 시즌 ${season} · ${hist.total}경기`;
    if (reset) box.innerHTML = list.length ? "" : `<div class="empty">이번 시즌 경기 기록이 없습니다.</div>`;
    for (const m of list) { hist.byId.set(m.id, m); box.insertAdjacentHTML("beforeend", histRow(m)); }
    hist.offset += list.length;
    $("#histMore").hidden = hist.offset >= hist.total;
    $("#histMore").textContent = `더 보기 (${hist.offset}/${hist.total})`;
  } catch (e) {
    if (reset) box.innerHTML = `<div class="empty">경기 기록을 불러오지 못했습니다 (${esc(e.message)}).</div>`;
  }
  hist.loading = false;
}
function histRow(m) {
  const mine = findMe(m); if (!mine) return "";
  const opp = m.teams.filter((t) => t !== mine.team).flatMap((t) => t.players)[0];
  const gain = mine.pl.mmrGain ?? (mine.pl.currentMmr - mine.pl.oldMmr);
  const side = (pl, cls) => `<span class="hside ${cls}">
      <span class="hname">${rc(pl?.race)}<b>${esc(pl?.name || "-")}</b></span>
      <span class="hres"><span class="mmr">(${pl?.oldMmr ?? "-"})</span> <span class="res ${pl?.won ? "w" : "l"}">${pl?.won ? "승" : "패"}</span></span>
      <span class="heroes">${heroList(pl)}</span>
    </span>`;
  return `<button type="button" class="hrow ${mine.pl.won ? "won" : "lost"}" data-mid="${esc(m.id)}">
    <span class="hvs">${side(mine.pl, "mine")}<span class="vs">vs</span>${side(opp, "theirs")}</span>
    <span class="hmeta"><span>${day(m.startTime)} · ${esc(m.mapName || m.map)} · ${dur(m.durationInSeconds)}${m.gameMode !== 1 && MODES[m.gameMode] ? " · " + esc(MODES[m.gameMode]) : ""}</span><span class="gain ${gain >= 0 ? "w" : "l"}">${Number.isFinite(gain) ? (gain >= 0 ? "+" : "") + gain : ""}</span></span>
  </button>`;
}
$("#hist").addEventListener("click", (e) => {
  const b = e.target.closest(".hrow"); if (!b) return;
  const m = hist.byId.get(b.dataset.mid);

let histScroll = 0;

/* ---------- polling ---------- */
let timer = null;
async function poll() {
  clearTimeout(timer);
  try {
    const m = await get(`/matches/ongoing/${encodeURIComponent(state.me)}`);
    if (m && m.teams) {
      setStatus("live", "경기 중");
      if (m.id !== state.liveId) {
        state.liveId = m.id;
        if (navigator.vibrate) navigator.vibrate(200);
        renderMatch($("#live"), m, true, "지금 경기 중");
        window.scrollTo({ top: 0 });
      }
    } else {
      setStatus("idle", "대기 중 · 자동 확인");
      if (state.liveId || !state.idleShown) {
        const ended = !!state.liveId;
        state.liveId = null; state.idleShown = true;
        liveIdle("대기 중 · 게임에 들어가면 여기에 상대가 뜹니다");
        if (ended) loadHistory(true);
      }
    }
  } catch (e) {
    setStatus("err", "연결 실패 · 재시도 중");
    if (!state.liveId) { state.idleShown = false; liveIdle("W3Champions에 연결하지 못했습니다 · 5초마다 다시 시도"); }
  }
  if (!document.hidden) timer = setTimeout(poll, POLL_MS);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll(); reWake(); } else clearTimeout(timer); });

/* ---------- my tag ---------- */
function renderMe() { $("#meBtn").textContent = state.me; }
$("#meBtn").onclick = () => { $("#meInput").value = state.me; $("#meDlg").showModal(); };
$("#meForm").addEventListener("submit", async () => {
  const v = $("#meInput").value.trim();
  if (!v.includes("#")) return;
  state.me = v; store("w3c_me", v); renderMe();
  await boot();
});

/* ---------- manual lookup ---------- */
$("#find").addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = $("#findInput").value.trim();
  if (!v.includes("#")) { $("#findInput").value = ""; $("#findInput").placeholder = "#숫자까지 입력하세요 (예: Lukas#21464)"; return; }
  const p = await get(`/players/${encodeURIComponent(v)}`).catch(() => null);
  if (!p) { $("#findInput").value = ""; $("#findInput").placeholder = `${v} 플레이어를 찾을 수 없습니다`; return; }
  const main = (p.winLosses || []).filter((w) => w.games).sort((a, b) => b.games - a.games)[0];
  openDetail((box) => {
    box.innerHTML = `<div class="ctx"><span class="label">직접 조회</span></div>`;
    const el = document.createElement("section"); el.className = "card"; box.appendChild(el);
    renderOpponent(el, { battleTag: p.battleTag, name: p.name }, { race: main?.race, gameMode: 1 });
  });
});

/* ---------- keep screen on ---------- */
let lock = null, wantLock = false;
async function reWake() { if (wantLock && !lock) try { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } catch {} }
$("#wake").onclick = async () => {
  wantLock = !wantLock;
  if (wantLock) await reWake(); else { await lock?.release(); lock = null; }
  $("#wake").classList.toggle("on", wantLock && !!lock);
  if (wantLock && !lock) { wantLock = false; $("#wake").textContent = "지원 안 됨"; }
};

/* ---------- boot ---------- */
async function boot() {
  state.liveId = null; state.idleShown = false;
  if (!$("#detail").hidden) closeDetail();
  liveIdle("연결 중…");
  try {
    const [seasons, mine] = await Promise.all([get("/ladder/seasons"), seasonsOf(state.me)]);
    state.current = seasons?.[0]?.id;
    state.mySeasons = mine.seasons;
    state.myRace = (mine.profile?.winLosses || []).filter((w) => w.games).sort((a, b) => b.games - a.games)[0]?.race;
  } catch {}
  poll();
  loadHistory(true);
}
fetch(API + "/ladder/active-modes").then((r) => r.json()).then((l) => { for (const m of l) if (!MODES[m.id]) MODES[m.id] = m.name; }).catch(() => {});
renderMe();
boot();
</script>
