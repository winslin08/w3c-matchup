<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>워챔스 전적 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single column — search bar on top, profile header, mode cards grid, MMR chart, match list */
:root {
  --bg: #f3f1ec; --panel: #ffffff; --ink: #1d1b19; --muted: #6d675e; --line: #e2ddd3;
  --gold: #a8741a; --win: #2f7d4f; --loss: #b23a32;
  --hu: #3b6fd1; --oc: #b2452f; --ne: #6b4fc0; --ud: #3f8a6e; --rnd: #8a7d63;
  --display: "Cinzel", Georgia, serif;
  --body: "Noto Sans KR", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14130f; --panel: #1e1c17; --ink: #ece6da; --muted: #a39b8c; --line: #343027;
    --gold: #e0ab4a; --win: #5cc185; --loss: #e8736a;
    --hu: #6f9bf0; --oc: #e2765e; --ne: #9c84ec; --ud: #6cc3a0; --rnd: #b8aa8c; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font: 700 1.6rem/1.1 var(--display); letter-spacing: .04em; margin: 0; color: var(--gold); }
h1 small { font: 500 .8rem var(--body); color: var(--muted); letter-spacing: 0; margin-left: 8px; }
h2 { font: 600 1rem var(--display); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px; color: var(--muted); }
form.search { display: flex; flex-wrap: wrap; gap: 8px; position: relative; }
form.search input, select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
form.search input { flex: 1 1 260px; min-width: 0; }
button { cursor: pointer; background: var(--gold); color: #fff; border-color: transparent; font-weight: 700; }
button.ghost { background: var(--panel); color: var(--ink); border-color: var(--line); font-weight: 500; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.suggest { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; z-index: 5; max-height: 340px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
.suggest button { display: flex; width: 100%; justify-content: space-between; gap: 12px; background: none; color: var(--ink); border: 0; border-bottom: 1px solid var(--line); border-radius: 0; text-align: left; font-weight: 500; }
.suggest button:hover, .suggest button:focus-visible { background: color-mix(in srgb, var(--gold) 12%, transparent); }
.suggest .tag { color: var(--muted); font-family: var(--mono); font-size: .85em; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.status { color: var(--muted); padding: 24px; text-align: center; }
.status.err { color: var(--loss); }
.profile { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.crest { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font: 700 1.5rem var(--display); color: #fff; flex: none; }
.profile .name { font: 700 1.5rem/1.2 var(--display); letter-spacing: .02em; }
.profile .tag { font-family: var(--mono); color: var(--muted); font-size: .9rem; }
.profile .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .9rem; margin-top: 4px; }
.profile .controls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.races { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.race { border-left: 4px solid var(--c); padding: 6px 10px; }
.race b { display: block; }
.race .wl { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; }
.bar { height: 6px; background: color-mix(in srgb, var(--loss) 45%, transparent); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--win); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.mode { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 2px; }
.mode .t { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
.mode .mmr { font: 700 1.6rem var(--mono); }
.mode .sub { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.league { font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); font-weight: 700; white-space: nowrap; }
.chip { font-size: .75rem; padding: 1px 7px; border-radius: 999px; color: #fff; background: var(--c); font-weight: 700; }
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 8px; }
.chart-head h2 { margin: 0; }
svg text { fill: var(--muted); font: 11px var(--mono); }
.matches { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 640px; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: .8rem; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.res { font-weight: 700; }
.res.w { color: var(--win); } .res.l { color: var(--loss); }
.opp { background: none; border: 0; color: var(--ink); padding: 0; font-weight: 500; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.opp:hover { color: var(--gold); }
.heroes { color: var(--muted); font-size: .82rem; }
.more { display: flex; justify-content: center; margin-top: 12px; }
.empty { color: var(--muted); }
footer { color: var(--muted); font-size: .8rem; text-align: center; }
footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>W3Champions<small>워챔스 전적 검색</small></h1>
  </header>

  <form class="search" id="searchForm" autocomplete="off">
    <input id="q" type="search" placeholder="닉네임 또는 배틀태그 (예: Happy 또는 Happy#35752)" aria-label="플레이어 검색">
    <button type="submit">검색</button>
    <div class="suggest" id="suggest" hidden></div>
  </form>

  <main id="main" style="display:grid;gap:20px">
    <div class="panel status">닉네임을 입력하면 후보 목록이 나옵니다. 배틀태그 전체(#숫자 포함)를 입력하면 바로 조회합니다.</div>
  </main>

  <footer>데이터: <a href="https://w3champions.com" target="_blank" rel="noopener">w3champions.com</a> 공개 API</footer>
</div>

<script>
const API = "https://website-backend.w3champions.com/api";
const RACES = { 0: ["랜덤", "--rnd", "R"], 1: ["휴먼", "--hu", "H"], 2: ["오크", "--oc", "O"], 4: ["나엘", "--ne", "N"], 8: ["언데드", "--ud", "U"], 16: ["랜덤", "--rnd", "R"] };
const LEAGUES = ["그랜드마스터", "마스터", "어뎁트", "다이아", "플래티넘", "골드", "실버", "브론즈", "그래스"];
let MODES = { 1: "1 vs 1", 2: "2 vs 2", 4: "4 vs 4", 5: "FFA", 6: "2 vs 2 AT" };
const state = { tag: null, season: null, gateway: 20, offset: 0, total: 0 };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const race = (r) => RACES[r] || ["?", "--rnd", "?"];
const pct = (x) => (x * 100).toFixed(1) + "%";

async function get(path) {
  const res = await fetch(API + path);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`API 오류 (${res.status})`);
  return res.json();
}

fetch(API + "/ladder/active-modes").then((r) => r.json()).then((list) => {
  for (const m of list) MODES[m.id] = m.name;
}).catch(() => {});

/* ---------- search ---------- */
let searchTimer;
$("#q").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const v = $("#q").value.trim();
  if (v.length < 2) return hideSuggest();
  searchTimer = setTimeout(() => suggest(v), 250);
});
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) hideSuggest(); });
function hideSuggest() { $("#suggest").hidden = true; }

async function suggest(v) {
  const box = $("#suggest");
  box.innerHTML = `<div class="status">검색 중…</div>`; box.hidden = false;
  try {
    const list = await get(`/players/global-search?search=${encodeURIComponent(v)}&pageSize=20`) || [];
    if (!list.length) { box.innerHTML = `<div class="status">"${esc(v)}" 와 일치하는 플레이어가 없습니다.</div>`; box.hidden = false; return; }
    box.innerHTML = list.map((p) => {
      const s = p.seasons?.map((x) => x.id).sort((a, b) => b - a) || [];
      return `<button type="button" data-tag="${esc(p.battleTag)}"><span>${esc(p.name)} <span class="tag">${esc(p.battleTag)}</span></span><span class="tag">${s.length ? "시즌 " + s.slice(0, 3).join(", ") + (s.length > 3 ? "…" : "") : "랭크 기록 없음"}</span></button>`;
    }).join("");
    box.hidden = false;
  } catch (e) {
    box.innerHTML = `<div class="status err">W3Champions 서버에 연결하지 못했습니다 (${esc(e.message)}). 파일 미리보기 화면이 아니라 크롬·사파리 같은 브라우저에서 열었는지 확인하세요.</div>`;
    box.hidden = false;
  }
}
$("#suggest").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tag]");
  if (b) { hideSuggest(); openPlayer(b.dataset.tag); }
});
$("#searchForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = $("#q").value.trim();
  if (!v) return;
  if (v.includes("#")) { hideSuggest(); openPlayer(v); }
  else suggest(v);
});

/* ---------- player ---------- */
function openPlayer(tag, season) {
  state.tag = tag; state.season = season ?? null; state.offset = 0;
  $("#q").value = tag;
  const h = "#" + encodeURIComponent(tag);
  if (location.hash !== h) history.replaceState(null, "", h);
  loadPlayer();
}

async function loadPlayer() {
  const main = $("#main");
  main.innerHTML = `<div class="panel status">불러오는 중…</div>`;
  const t = encodeURIComponent(state.tag);
  try {
    const [p, settings] = await Promise.all([get(`/players/${t}`), get(`/personal-settings/${t}`).catch(() => null)]);
    if (!p) { main.innerHTML = `<div class="panel status err">"${esc(state.tag)}" 플레이어를 찾을 수 없습니다. 배틀태그의 대소문자와 #숫자를 확인하세요.</div>`; return; }
    const seasons = (p.participatedInSeasons || []).map((s) => s.id).sort((a, b) => b - a);
    if (state.season == null) state.season = seasons[0] ?? 0;
    const [modes, races] = await Promise.all([
      get(`/players/${t}/game-mode-stats?gateWay=${state.gateway}&season=${state.season}`),
      get(`/players/${t}/race-stats?gateWay=${state.gateway}&season=${state.season}`),
    ]);
    renderPlayer(p, settings, seasons, modes || [], races || []);
    loadMatches(true);
  } catch (e) {
    main.innerHTML = `<div class="panel status err">데이터를 불러오지 못했습니다: ${esc(e.message)}. 잠시 후 다시 시도하세요.</div>`;
  }
}

function renderPlayer(p, settings, seasons, modes, races) {
  const total = (p.winLosses || []).filter((w) => w.games);
  const sumW = total.reduce((a, w) => a + w.wins, 0), sumL = total.reduce((a, w) => a + w.losses, 0);
  const main = total.slice().sort((a, b) => b.games - a.games)[0];
  const [, mainVar, mainLetter] = race(main?.race);
  const loc = settings?.country || settings?.location;
  const aka = p.playerAkaData?.name;
  const links = [["twitch", "Twitch", "https://twitch.tv/"]].filter(([k]) => settings?.[k]);

  const modeCards = modes.filter((m) => m.games).sort((a, b) => b.games - a.games).map((m) => {
    const r = m.race != null ? race(m.race) : null;
    const lg = m.rank > 0 ? `${LEAGUES[m.leagueOrder] ?? "리그 " + m.leagueOrder}${m.division ? " " + m.division : ""}` : "배치 전";
    return `<div class="mode">
      <div class="t"><span>${esc(MODES[m.gameMode] || "모드 " + m.gameMode)} ${r ? `<span class="chip" style="--c:var(${r[1]})">${r[0]}</span>` : ""}</span><span class="league">${lg}</span></div>
      <div class="mmr">${m.mmr}<span class="sub" style="font-family:var(--body);font-weight:400"> MMR</span></div>
      <div class="sub">${m.rank > 0 ? `#${m.rank} · ` : ""}상위 ${pct(1 - m.quantile)} · RP ${m.rankingPoints.toFixed(1)}</div>
      <div class="sub">${m.wins}승 ${m.losses}패 · 승률 ${pct(m.winrate)}</div>
      <div class="bar"><i style="width:${m.winrate * 100}%"></i></div>
    </div>`;
  }).join("") || `<p class="empty">이 시즌에 플레이한 기록이 없습니다.</p>`;

  const raceRows = races.filter((r) => r.games).sort((a, b) => b.games - a.games).map((r) => {
    const [n, v] = race(r.race);
    return `<div class="race" style="--c:var(${v})"><b>${n}</b><span class="wl">${r.wins}승 ${r.losses}패 · ${pct(r.winrate)}</span><div class="bar"><i style="width:${r.winrate * 100}%"></i></div></div>`;
  }).join("") || `<p class="empty">기록 없음</p>`;

  const oneVone = modes.filter((m) => m.gameMode === 1 && m.games).sort((a, b) => b.games - a.games);

  $("#main").innerHTML = `
    <section class="panel profile">
      <div class="crest" style="background:var(${mainVar})">${mainLetter}</div>
      <div style="min-width:0">
        <div class="name">${esc(p.name)}</div>
        <div class="tag">${esc(p.battleTag)}</div>
        <div class="meta">
          <span>통산 ${sumW}승 ${sumL}패 (${sumW + sumL ? pct(sumW / (sumW + sumL)) : "-"})</span>
          ${main ? `<span>주종족 ${race(main.race)[0]}</span>` : ""}
          ${loc ? `<span>지역 ${esc(loc)}</span>` : ""}
          ${aka ? `<span>AKA ${esc(aka)}</span>` : ""}
          ${links.map(([k, l, u]) => `<a href="${u}${encodeURIComponent(settings[k])}" target="_blank" rel="noopener">${l}</a>`).join("")}
          <a href="https://w3champions.com/player/${encodeURIComponent(p.battleTag)}" target="_blank" rel="noopener">W3C 프로필 ↗</a>
        </div>
      </div>
      <div class="controls">
        <select id="season" aria-label="시즌">${seasons.map((s) => `<option value="${s}" ${s === state.season ? "selected" : ""}>시즌 ${s}</option>`).join("")}</select>
        <select id="gateway" aria-label="게이트웨이"><option value="20" ${state.gateway === 20 ? "selected" : ""}>유럽(통합)</option><option value="10" ${state.gateway === 10 ? "selected" : ""}>아메리카</option></select>
      </div>
    </section>

    <section class="panel"><h2>통산 종족별 전적</h2><div class="races">${total.sort((a, b) => b.games - a.games).map((r) => {
      const [n, v] = race(r.race);
      return `<div class="race" style="--c:var(${v})"><b>${n}</b><span class="wl">${r.wins}승 ${r.losses}패 · ${pct(r.winrate)}</span><div class="bar"><i style="width:${r.winrate * 100}%"></i></div></div>`;
    }).join("")}</div></section>

    <section class="panel"><h2>시즌 ${state.season} 모드별 랭크</h2><div class="modes">${modeCards}</div></section>

    <section class="panel"><h2>시즌 ${state.season} 종족별 전적</h2><div class="races">${raceRows}</div></section>

    ${oneVone.length ? `<section class="panel">
      <div class="chart-head"><h2>1 vs 1 MMR 추이</h2>
        <select id="chartRace" aria-label="종족">${oneVone.map((m) => `<option value="${m.race}">${race(m.race)[0]}</option>`).join("")}</select></div>
      <div id="chart" class="empty">불러오는 중…</div></section>` : ""}

    <section class="panel"><h2 id="matchTitle">시즌 ${state.season} 최근 경기</h2><div class="matches" id="matches"><p class="empty">불러오는 중…</p></div><div class="more" id="more"></div></section>
  `;
  $("#season").onchange = (e) => { state.season = +e.target.value; state.offset = 0; loadPlayer(); };
  $("#gateway").onchange = (e) => { state.gateway = +e.target.value; state.offset = 0; loadPlayer(); };
  if (oneVone.length) {
    $("#chartRace").onchange = (e) => loadChart(+e.target.value);
    loadChart(oneVone[0].race);
  }
}

/* ---------- MMR chart ---------- */
async function loadChart(r) {
  const el = $("#chart");
  try {
    const d = await get(`/players/${encodeURIComponent(state.tag)}/mmr-rp-timeline?race=${r}&gateWay=${state.gateway}&season=${state.season}&gameMode=1`);
    const pts = d?.mmrRpAtDates || [];
    if (pts.length < 2) { el.innerHTML = `<p class="empty">그래프를 그릴 만큼 기록이 없습니다.</p>`; return; }
    el.className = ""; el.innerHTML = chartSvg(pts, race(r)[1]);
  } catch { el.innerHTML = `<p class="empty">그래프를 불러오지 못했습니다.</p>`; }
}

function chartSvg(pts, colorVar) {
  const W = 900, H = 240, L = 44, R = 12, T = 12, B = 26;
  const vals = pts.map((p) => p.mmr);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const step = Math.max(25, Math.ceil((hi - lo) / 4 / 25) * 25);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi += step;
  const t0 = new Date(pts[0].date).getTime(), t1 = new Date(pts.at(-1).date).getTime();
  const x = (t) => L + ((t - t0) / (t1 - t0 || 1)) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const xy = pts.map((p) => [x(new Date(p.date).getTime()), y(p.mmr)]);
  const line = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const area = line + `L${xy.at(-1)[0]} ${H - B}L${xy[0][0]} ${H - B}Z`;
  let grid = "";
  for (let v = lo; v <= hi; v += step) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const fmt = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const ticks = 5; let xt = "";
  for (let i = 0; i <= ticks; i++) { const t = t0 + ((t1 - t0) * i) / ticks; xt += `<text x="${x(t)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === ticks ? "end" : "middle"}">${fmt(t)}</text>`; }
  const last = xy.at(-1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="MMR 추이 그래프">
    ${grid}${xt}
    <path d="${area}" fill="var(${colorVar})" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(${colorVar})" stroke-width="2"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(${colorVar})"/>
    <text x="${last[0] - 8}" y="${last[1] - 8}" text-anchor="end" style="fill:var(--ink);font-weight:700">${vals.at(-1)}</text>
  </svg>`;
}

/* ---------- matches ---------- */
async function loadMatches(reset) {
  const box = $("#matches"); if (!box) return;
  const size = 20;
  try {
    const d = await get(`/matches/search?playerId=${encodeURIComponent(state.tag)}&gateway=${state.gateway}&offset=${state.offset}&pageSize=${size}&season=${state.season}`);
    const list = d?.matches || [];
    state.total = d?.count || 0;
    $("#matchTitle").textContent = `시즌 ${state.season} 경기 기록 (${state.total}경기)`;
    if (reset && !list.length) { box.innerHTML = `<p class="empty">이 시즌 경기 기록이 없습니다.</p>`; $("#more").innerHTML = ""; return; }
    const rows = list.map(matchRow).join("");
    if (reset) box.innerHTML = `<table><thead><tr><th>결과</th><th>모드</th><th>종족</th><th>상대</th><th>맵</th><th>MMR</th><th>시간</th><th>날짜</th></tr></thead><tbody>${rows}</tbody></table>`;
    else box.querySelector("tbody").insertAdjacentHTML("beforeend", rows);
    state.offset += list.length;
    $("#more").innerHTML = state.offset < state.total ? `<button class="ghost" id="moreBtn" type="button">더 보기 (${state.offset}/${state.total})</button>` : "";
    const mb = $("#moreBtn"); if (mb) mb.onclick = () => loadMatches(false);
  } catch (e) { box.innerHTML = `<p class="empty">경기 기록을 불러오지 못했습니다: ${esc(e.message)}</p>`; }
}

function matchRow(m) {
  const me = state.tag.toLowerCase();
  let mine, myTeam;
  for (const team of m.teams) for (const pl of team.players) if (pl.battleTag.toLowerCase() === me) { mine = pl; myTeam = team; }
  if (!mine) return "";
  const opps = m.teams.filter((t) => t !== myTeam).flatMap((t) => t.players);
  const won = mine.won;
  const gain = mine.mmrGain ?? (mine.currentMmr - mine.oldMmr);
  const mins = Math.floor(m.durationInSeconds / 60), secs = String(m.durationInSeconds % 60).padStart(2, "0");
  const date = new Date(m.startTime);
  const rc = (pl) => { const [n, v] = race(pl.race); return `<span class="chip" style="--c:var(${v})">${n}</span>`; };
  const heroes = (pl) => (pl.heroes || []).map((h) => `${h.name} ${h.level}`).join(", ");
  return `<tr>
    <td class="res ${won ? "w" : "l"}">${won ? "승" : "패"}</td>
    <td>${esc(MODES[m.gameMode] || m.gameMode)}</td>
    <td>${rc(mine)}<div class="heroes">${esc(heroes(mine))}</div></td>
    <td>${opps.map((o) => `<div>${rc(o)} <button type="button" class="opp" data-tag="${esc(o.battleTag)}">${esc(o.name)}</button> <span class="heroes">${o.oldMmr ?? ""}</span><div class="heroes">${esc(heroes(o))}</div></div>`).join("")}</td>
    <td>${esc(m.mapName || m.map)}</td>
    <td class="num">${mine.oldMmr ?? "-"} <span class="res ${gain >= 0 ? "w" : "l"}">${gain >= 0 ? "+" : ""}${gain ?? ""}</span></td>
    <td class="num">${mins}:${secs}</td>
    <td class="num">${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, "0")}.${String(date.getDate()).padStart(2, "0")}</td>
  </tr>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".opp");
  if (b) { openPlayer(b.dataset.tag); window.scrollTo({ top: 0, behavior: "smooth" }); }
});

/* ---------- boot ---------- */
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && h.includes("#")) openPlayer(h);
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
